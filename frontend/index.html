<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD Generator</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --fg:#1b1b1b; --muted:#666; --card:#fff; --line:#ddd; --accent:#1a73e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151515; --fg:#eee; --muted:#999; --card:#1f1f1f; --line:#333; --accent:#8ab4f8; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:8px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  button { margin-top:12px; padding:8px 14px; border:0; border-radius:6px; background:var(--accent);
    color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
  .score { font-size:28px; font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>AI Job Description Generator</h1>
  <p class="muted">Gemini on Vertex AI · Firestore · Cloud Functions</p>

  <div class="card">
    <label for="api">Generate function URL</label>
    <input id="api" placeholder="https://generate-job-description-xxxx.run.app">
    <label for="capi">Compliance function URL</label>
    <input id="capi" placeholder="https://validate-compliance-xxxx.run.app">
    <label for="role">Role template</label>
    <select id="role">
      <option value="software_engineer">Software Engineer</option>
      <option value="ml_engineer">Machine Learning Engineer</option>
      <option value="marketing_manager">Marketing Manager</option>
    </select>
    <label for="req">Custom requirements (optional)</label>
    <textarea id="req" rows="2" placeholder="e.g. Experience with microservices"></textarea>
    <button id="go">Generate</button>
  </div>

  <div class="card" id="out" hidden></div>
  <div class="card" id="comp" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
$("go").onclick = async () => {
  $("go").disabled = true; $("out").hidden = false; $("comp").hidden = true;
  $("out").textContent = "Generating…";
  try {
    const jd = await post($("api").value, { role_id: $("role").value,
                                            custom_requirements: $("req").value || null });
    $("out").innerHTML = marked.parse(jd.description) +
      `<p class="muted">Saved as Firestore doc ${jd.job_id}</p>`;
    if ($("capi").value) {
      $("comp").hidden = false; $("comp").textContent = "Reviewing compliance…";
      const c = await post($("capi").value, { job_description: jd.description });
      const li = (xs) => xs.map((x) => `<li>${x}</li>`).join("") || "<li>None</li>";
      $("comp").innerHTML = `<div class="score">${c.score}/10</div><p class="muted">Compliance score</p>
        <b>Issues</b><ul>${li(c.issues)}</ul><b>Recommendations</b><ul>${li(c.recommendations)}</ul>`;
    }
  } catch (e) { $("out").textContent = "Error: " + e.message; }
  $("go").disabled = false;
};
</script>
</body>
</html>
